name = "cf-notify"
main = "src/index.mjs"
compatibility_date = "2026-07-26"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

assets = { directory = "public", binding = "ASSETS", html_handling = "none", not_found_handling = "single-page-application", run_worker_first = true }

[[d1_databases]]
binding = "DB"
database_name = "cf-notify"
database_id = "3d58d1a6-d9d3-4d3e-9ed2-8c616585a303"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "579b7fea47fc49879d2834d7d4820d70"

[[services]]
binding = "CF_AUTH"
service = "cf-auth"
entrypoint = "NotificationDirectory"

[vars]
BIND_CODE_TTL_SEC = "300"
WECHAT_CODE_LOGIN_ENABLED = "false"
WECHAT_CALLBACK_MAX_SKEW_SEC = "300"
RECONCILE_AFTER_SEC = "120"
RECONCILE_BATCH_SIZE = "50"
CF_AUTH_ISSUER = "https://cf-auth.ehzyil.cc.cd"
CF_AUTH_JWT_AUDIENCE = "cf-auth-session"
EGRESS_TIMEOUT_MS = "10000"
SUBSCRIPTIONS_DEFAULT_OPEN = "false"
ENFORCE_USER_SERVICE_MEMBERSHIP = "true"
NOTIFICATION_DIRECTORY_MODE = "rpc"
WECHAT_PROVIDER_ACCOUNT_ID = "wechat-main"
WECHAT_SEND_MODE = "custom_text"
WECOM_CALLBACK_MAX_SKEW_SEC = "300"
WECOM_PROVIDER_ACCOUNT_ID = "wecom-main"
WECOM_CORP_ID = "ww37c322e2b04fab42"
WECOM_ACCOUNT_NAME = "ehzyil的快乐星球"
WECOM_QRCODE_URL = "https://cf-notify.ehzyil.cc.cd/channel-assets/wecom-join.jpg"

[[queues.producers]]
binding = "NOTIFY_DISPATCH_QUEUE"
queue = "cf-notify-dispatch"

[[queues.producers]]
binding = "NOTIFY_DELIVERY_QUEUE"
queue = "cf-notify-delivery"

[[queues.consumers]]
queue = "cf-notify-dispatch"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "cf-notify-dispatch-dlq"

[[queues.consumers]]
queue = "cf-notify-delivery"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 8
dead_letter_queue = "cf-notify-delivery-dlq"

[[queues.consumers]]
queue = "cf-notify-dispatch-dlq"
max_batch_size = 10
max_batch_timeout = 5

[[queues.consumers]]
queue = "cf-notify-delivery-dlq"
max_batch_size = 10
max_batch_timeout = 5

[observability]
enabled = true
head_sampling_rate = 1
